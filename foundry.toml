[profile.default]
src = "src"
out = "out"
libs = ["lib"]
# no solc pin: src pins 0.8.28 in its pragmas; test/vendor/allowance needs 0.7.6
# paris: no PUSH0/MCOPY/TSTORE, so the bytecode runs on any Orbit chain version
evm_version = "paris"
optimizer = true
optimizer_runs = 10000
remappings = [
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
  "forge-std/=lib/forge-std/src/",
  "safe/=lib/safe-smart-account/contracts/",
]
# AllowanceModule 0.1.1 is built exactly like its release (solc 0.7.6, optimizer off), so the
# tests run the same code that is deployed on Robinhood Chain.
additional_compiler_profiles = [{ name = "allowance", optimizer = false, optimizer_runs = 200 }]
compilation_restrictions = [{ paths = "test/vendor/allowance/**", version = "=0.7.6", max_optimizer_runs = 200 }]

[fuzz]
runs = 512

[invariant]
runs = 256
depth = 64
fail_on_revert = false

[rpc_endpoints]
robinhood = "https://rpc.mainnet.chain.robinhood.com"

[fmt]
# vendored release code stays byte-identical to upstream
ignore = ["test/vendor/**"]
